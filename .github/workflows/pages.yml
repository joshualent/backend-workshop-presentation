# Builds the deck and publishes it to GitHub Pages on every push to `next`:
# https://slides.hyperf.app/ (the custom domain is set in the repo's Pages
# settings; joshualent.github.io/backend-workshop-presentation/ redirects there)
name: Deploy slides to GitHub Pages

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: slides/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The custom domain serves the site from its root.
      - run: pnpm build --base /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
